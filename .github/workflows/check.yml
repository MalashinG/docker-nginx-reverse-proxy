name: Check
on: push
jobs:
    os:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout 
              uses: actions/checkout@v6
            - name: Check Docker availability
              run: |
                docker --version 
                docker info


            - name: Build Docker image
              run: |
                pwd
                ls -la
                cd docker_nginx/
                ls -la
                docker build .
