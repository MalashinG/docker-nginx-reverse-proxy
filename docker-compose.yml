version: "3"
services:                   
  nginx:
    build: .
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

    ports: 
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${LETSENCRYPT_DIR}:/etc/letsencrypt:ro
      - ${CONF_SITE_HOST}:/etc/nginx/conf.d/site.conf:ro
      - ${CONF_NGINX_HOST}:/etc/nginx/nginx.conf:ro
      - ./site/html:/usr/share/nginx/html:ro
      - ./logs/nginx:/var/log/nginx

